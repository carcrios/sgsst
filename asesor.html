<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#151b24">
<title>Panel del asesor · Portal SSTA</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="common.css">
<link rel="stylesheet" href="sgsst.css">
<style>
.seg{display:inline-block;font-weight:800;font-size:11px;border-radius:6px;padding:2px 7px;margin-right:4px;background:#151b24;color:#fff;}
.seg.s7{background:#2f7d55;} .seg.s21{background:#b07a00;} .seg.s60{background:#9c2f22;}
.filtro{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;}
.filtro button{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px;font:600 13px inherit;font-family:inherit;cursor:pointer;}
.filtro button.on{background:#151b24;color:#fff;border-color:#151b24;}
.tar{border-bottom:1px dashed #e6eaee;padding:9px 0;font-size:13.5px;}
.tar .tt{font-weight:700;line-height:1.35;}
.tar small{display:block;color:var(--muted);font-size:11.5px;line-height:1.4;}
.tar .acc{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap;}
.std{display:flex;gap:8px;align-items:flex-start;border-bottom:1px dashed #e6eaee;padding:7px 0;font-size:13px;line-height:1.35;}
.std input{width:20px;height:20px;flex:0 0 20px;}
.std small{display:block;color:var(--muted);font-size:11.5px;}
</style>
</head>
<body>
<div class="wrap">
<div class="screen active" id="scrLista">
  <div class="hdr">
    <a class="back" href="index.html">← Volver al portal</a>
    <div class="marca-titulo"><span class="marca" role="img" aria-label="INDIMON"></span><div><div class="eyebrow">Asesoría SST</div>
    <h1>Panel del asesor</h1>
    <p>Tus empresas cliente por tamaño y riesgo (7, 21 o 60 estándares), las tareas que les dejas y su avance</p></div></div>
  </div>
  <div id="avisoSrv"></div><div id="avisoCopia"></div>
  <div class="kpis" id="kpis"></div>
  <div class="filtro" id="fGrupo">
    <button type="button" class="on" data-g="">Todos</button><button type="button" data-g="7">7 estándares</button><button type="button" data-g="21">21 estándares</button><button type="button" data-g="60">60 estándares</button>
  </div>
  <div class="grid2"><select id="fRiesgo" class="buscar" style="margin:0;"><option value="">Todas las clases de riesgo</option><option>I</option><option>II</option><option>III</option><option>IV</option><option>V</option></select>
    <input type="search" class="buscar" id="buscar" placeholder="Buscar cliente" style="margin:0;"></div>
  <div id="lista" style="margin-top:10px;"><div class="empty">Cargando…</div></div>
  <button type="button" class="btn amber" id="btnNuevo">+ Nuevo cliente</button>
  <button type="button" class="btn ghost" id="btnSync">🔄 Traer el avance de todos los clientes</button>
  <button type="button" class="btn ghost" id="btnPdf">🖨️ Estado de mis clientes (PDF)</button>
  <div class="version-portal">Portal SSTA · versión v106</div>
</div>
<div class="screen" id="scrCli"></div>
</div>
<script src="empresa.js"></script>
<script src="config.js"></script>
<script src="common.js"></script>
<script src="sgsst-ui.js"></script>
<script src="registros.js"></script>
<script src="auditorias-plantillas.js"></script>
<script>
OfflineBanner.init();
OutboxBadge.init();
if (typeof Outbox !== 'undefined') Outbox.flush();
if (typeof UpdateManager !== 'undefined') UpdateManager.init();

const $ = UI.$;
const ORIGEN = 'Asesor SST';
const C_CLI = [{ k: 'nombre', l: 'Empresa', req: true }, { k: 'nit', l: 'NIT', medio: true }, { k: 'ciudad', l: 'Ciudad', medio: true },
  { k: 'actividad', l: 'Actividad económica' },
  { k: 'trabajadores', l: 'Número de trabajadores', t: 'number', req: true, medio: true }, { k: 'claseRiesgo', l: 'Clase de riesgo más alta', t: 'select', op: ['I', 'II', 'III', 'IV', 'V'], medio: true },
  { k: 'contacto', l: 'Contacto (responsable del SG-SST)', medio: true }, { k: 'telefono', l: 'Teléfono', medio: true }, { k: 'correo', l: 'Correo' },
  { k: 'codigo', l: 'Código en tu sitio multiempresa', ph: 'ej: acme-sas', medio: true, ayuda: 'Si la empresa entra a TU sitio con ?e=código.' },
  { k: 'sitio', l: 'O dirección de su propio portal', ph: 'https://…github.io/…', medio: true, ayuda: 'Si tiene un sitio aparte.' },
  { k: 'servidor', l: 'URL del servidor del cliente (/exec)', ph: 'https://script.google.com/macros/s/…/exec', ayuda: 'La que sale en verConfiguracion del servidor único de la empresa. Sin ella, el cliente queda solo como registro (no se le pueden dejar tareas).' },
  { k: 'modo', l: 'Tipo de servidor', t: 'select', op: [['unico', 'Servidor único (empresa instalada con el portal)'], ['sgsst', 'URL directa del SG-SST']], medio: true },
  { k: 'clave', l: 'Clave del portal del cliente', medio: true, ayuda: 'La clave que se escribe en 🔑 Clave en sus celulares. Queda guardada en tu servidor; solo la ven Administrador y SST.' },
  { k: 'proximaVisita', l: 'Próxima visita', t: 'date', medio: true }, { k: 'estado', l: 'Estado', t: 'select', op: ['ACTIVO', 'INACTIVO'], medio: true },
  { k: 'notas', l: 'Notas', t: 'textarea' }];
let rows = [], fG = '', actual = null;
const de = (t)=> rows.filter((x)=> x.tipo === t);
function show(id){ document.querySelectorAll('.screen').forEach((s)=>s.classList.toggle('active', s.id === id)); window.scrollTo(0, 0); }
const segHtml = (g)=> '<span class="seg s' + g + '">' + g + ' est.</span>';

/* Su portal: su propio sitio o el tuyo multiempresa con su código. */
const sitioCli = (d)=> /^https?:\/\//.test(d.sitio || '') ? d.sitio : /^[a-z0-9][a-z0-9-]{1,39}$/.test(d.codigo || '') ? location.href.split(/[?#]/)[0].replace(/[^/]*$/, '') + '?e=' + encodeURIComponent(d.codigo) : '';
const verChip = (v)=> !v ? '' : v === VERSION_PORTAL_WEB ? '<span class="chip ok">servidor ' + esc(v) + '</span>' : '<span class="chip pronto" title="Corre herramientas/actualizar-servidores.js">servidor ' + esc(v) + ' · desactualizado</span>';
/* ── Conexión con el servidor de cada cliente ── */
const Cli = {
  url(c){ const b = String(c.servidor || '').trim().replace(/\/+$/, ''); return !b ? '' : c.modo === 'sgsst' ? b : b + '/sgsst'; },
  _k(c){ return 'ssta-sesion-cli:' + c.id; },
  ses(c){ try { const s = JSON.parse(localStorage.getItem(this._k(c)) || 'null'); return s && s.exp > Date.now() ? s : null; } catch (e) { return null; } },
  async _json(res){ const t = await res.text(); try { return JSON.parse(t); } catch (e) { return { ok: false, error: 'El servidor del cliente no respondió con datos (¿URL correcta y publicada como aplicación web?).' }; } },
  async get(c, params){
    const s = this.ses(c), q = Object.keys(params).map((k)=> k + '=' + encodeURIComponent(params[k])).join('&');
    return this._json(await fetchWithRetry(this.url(c) + '?' + q + '&token=' + encodeURIComponent(c.clave || '') + (s ? '&sesion=' + encodeURIComponent(s.token) : '')));
  },
  async post(c, body){
    const s = this.ses(c);
    return this._json(await fetch(this.url(c), { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ token: c.clave || '', sesion: s ? s.token : '', opId: SGSST.nuevoOpId() }, body)) }));
  },
  async entrar(c, usuario, clave){
    const sal = await this.get(c, { action: 'sal', usuario: String(usuario).trim().toLowerCase() });
    if (!sal.ok) return sal;
    const r = await this.post(c, { action: 'entrar', usuario: String(usuario).trim().toLowerCase(), prueba: await Sesion.derivar(clave, sal.salt, sal.iter) });
    if (r.ok) try { localStorage.setItem(this._k(c), JSON.stringify({ token: r.sesion, exp: r.exp, yo: r.yo })); } catch (e) {}
    return r;
  },
  /** Si el cliente usa usuarios con nombre, pide entrar con el usuario que te dio. */
  pedir(c, motivo){
    return new Promise((ok)=> {
      const m = UI.modal('<h3>Entrar al portal de ' + esc(c.nombre) + '</h3><p class="ayuda">' + esc(motivo || 'Este cliente usa usuarios con nombre. Entra con el usuario que te creó (rol SST).') + '</p>' +
        '<div class="field"><label>Usuario</label><input type="text" id="ceU" autocapitalize="none"></div><div class="field"><label>Clave</label><input type="password" id="ceC"></div>' +
        '<button type="button" class="btn amber" id="ceOk">Entrar</button><button type="button" class="btn ghost" data-cerrar>Cancelar</button><div class="status-msg" id="ceMsg"></div>', true);
      m.el.querySelector('[data-cerrar]').addEventListener('click', ()=> ok(false));
      m.el.querySelector('#ceOk').addEventListener('click', async ()=> {
        m.el.querySelector('#ceMsg').textContent = 'Comprobando…';
        const r = await this.entrar(c, m.el.querySelector('#ceU').value, m.el.querySelector('#ceC').value);
        if (!r.ok) { m.el.querySelector('#ceMsg').textContent = r.error || 'No se pudo entrar.'; return; }
        m.cerrar(); ok(true);
      });
    });
  },
  /** GET/POST que, si el cliente pide sesión, ofrece entrar y reintenta una vez. */
  async pedirSiHaceFalta(c, fn){
    let r = await fn();
    if (r && r.codigoError === 'SESION' && await this.pedir(c, r.error)) r = await fn();
    return r;
  }
};

async function cargar(){
  if (UI.avisoServidor($('avisoSrv'))) { $('lista').innerHTML = ''; return; }
  const r = await SGSST.listar('cliente');
  UI.avisoCopia($('avisoCopia'), r);
  rows = r.rows; pintar();
}
function pintar(){
  const h = UI.hoy(), act = de('cliente').filter((x)=> x.estado !== 'INACTIVO');
  const cuenta = (g)=> act.filter((x)=> Number(x.resumen.grupo0312) === g).length;
  const desact = act.filter((x)=> x.resumen.versionServidor && x.resumen.versionServidor !== VERSION_PORTAL_WEB).length;
  const venc = act.reduce((a, x)=> a + (Number(x.resumen.tareasVencidas) || 0), 0), visV = act.filter((x)=> x.vence && x.vence < h).length;
  $('kpis').innerHTML = '<div class="kpi"><div class="v">' + act.length + '</div><div class="n">clientes activos</div><div class="f">' + segHtml(7) + cuenta(7) + ' · ' + segHtml(21) + cuenta(21) + ' · ' + segHtml(60) + cuenta(60) + '</div></div>' +
    '<div class="kpi ' + (venc ? 'mal' : 'ok') + '"><div class="v">' + venc + '</div><div class="n">tareas vencidas en los clientes</div><div class="f">según la última sincronización</div></div>' +
    '<div class="kpi ' + (visV ? 'mal' : 'ok') + '"><div class="v">' + visV + '</div><div class="n">visitas atrasadas</div></div>' +
    (act.some((x)=> x.resumen.versionServidor) ? '<div class="kpi ' + (desact ? 'pronto' : 'ok') + '"><div class="v">' + desact + '</div><div class="n">servidores por actualizar</div><div class="f">portal ' + esc(VERSION_PORTAL_WEB) + ' · herramientas/actualizar-servidores.js</div></div>' : '');
  const q = UI.norm($('buscar').value).trim(), rg = $('fRiesgo').value;
  const l = de('cliente').filter((x)=> (!fG || String(x.resumen.grupo0312) === fG) && (!rg || x.resumen.claseRiesgo === rg) && (!q || UI.norm(x.titulo + ' ' + x.resumen.nit + ' ' + x.resumen.ciudad).includes(q)))
    .sort((a, b)=> (a.estado === 'INACTIVO') - (b.estado === 'INACTIVO') || (Number(b.resumen.tareasVencidas) || 0) - (Number(a.resumen.tareasVencidas) || 0) || String(a.titulo).localeCompare(String(b.titulo)));
  $('lista').innerHTML = l.length ? l.map((x)=> { const s = x.resumen, c = x.estado === 'INACTIVO' ? 'gris' : Number(s.tareasVencidas) ? 'mal' : x.vence && x.vence < h ? 'pronto' : 'ok';
    return '<button type="button" class="item ' + c + '" data-id="' + esc(x.id) + '"><div class="fila"><div><div class="t">' + segHtml(Number(s.grupo0312) || 60) + esc(x.titulo) + '</div>' +
      '<div class="m">' + esc([s.trabajadores ? s.trabajadores + ' trabajadores' : '', s.claseRiesgo ? 'riesgo ' + s.claseRiesgo : '', s.ciudad].filter(Boolean).join(' · ')) + '</div>' +
      '<div class="m">' + (s.sincronizado ? 'Tareas: ' + (Number(s.tareasAbiertas) || 0) + ' abiertas, ' + (Number(s.tareasVencidas) || 0) + ' vencidas' + (s.puntaje !== '' && s.puntaje != null ? ' · autoevaluación ' + esc(String(s.puntaje).replace('.', ',')) + '%' : '') + ' · al ' + esc(new Date(s.sincronizado).toLocaleDateString('es-CO')) : 'Sin sincronizar') +
      (x.vence ? ' · visita ' + esc(UI.corta(x.vence)) : '') + (s.versionServidor && s.versionServidor !== VERSION_PORTAL_WEB ? ' · <b style="color:#7a5800;">servidor ' + esc(s.versionServidor) + '</b>' : '') + '</div></div><span class="chip ' + c + '">' + (x.estado === 'INACTIVO' ? 'Inactivo' : Number(s.tareasVencidas) ? 'Atrasado' : 'Al día') + '</span></div></button>'; }).join('')
    : '<div class="empty">' + (de('cliente').length ? 'Ningún cliente con ese filtro.' : 'Todavía no hay clientes. Agrega el primero.') + '</div>';
  $('lista').querySelectorAll('[data-id]').forEach((b)=> b.addEventListener('click', ()=> abrir(b.dataset.id)));
}
$('fGrupo').addEventListener('click', (e)=> { const b = e.target.closest('[data-g]'); if (!b) return; fG = b.dataset.g; $('fGrupo').querySelectorAll('button').forEach((x)=> x.classList.toggle('on', x === b)); pintar(); });
$('fRiesgo').addEventListener('change', pintar); $('buscar').addEventListener('input', pintar);

function editarCliente(d){
  Registros.editar({ titulo: (d.nuevo ? 'Nuevo cliente' : d.nombre), campos: C_CLI, datos: d,
    despues: '<div class="aviso info" data-seg></div>',
    alAbrir: (el, pref)=> { const v = ()=> { const g = grupo0312(el.querySelector('#' + pref + 'trabajadores').value, el.querySelector('#' + pref + 'claseRiesgo').value); el.querySelector('[data-seg]').textContent = 'Le aplican ' + UI.textoGrupo(g) + '.'; };
      el.querySelector('#' + pref + 'trabajadores').addEventListener('input', v); el.querySelector('#' + pref + 'claseRiesgo').addEventListener('change', v); v(); },
    borrar: d.nuevo ? null : async ()=> { const ok = await Registros.borrar(d.id, 'Borrado desde el panel del asesor'); if (ok) { show('scrLista'); cargar(); } return ok; },
    alGuardar: async (v)=> { v.grupo0312 = grupo0312(v.trabajadores, v.claseRiesgo); v.servidor = String(v.servidor || '').trim();
      if (v.servidor && !/^https:\/\//.test(v.servidor)) return 'La URL del servidor debe empezar por https://';
      const r = await Registros.guardar('cliente', d.id, v, d.nuevo ? 0 : d.version); if (typeof r === 'string') return r;
      await cargar(); if (!d.nuevo) abrir(d.id); return true; } });
}
$('btnNuevo').addEventListener('click', ()=> editarCliente({ id: SGSST.nuevoId('CLI'), nuevo: true, claseRiesgo: 'I', modo: 'unico', estado: 'ACTIVO' }));

/* ── Un cliente: su segmento, sus tareas y las visitas ── */
let tareas = [], autoeval = null;
async function abrir(id){
  const d = await Registros.abrir(id); if (!d) return;
  actual = d; tareas = []; autoeval = null; perfilCli = null;
  const g = Number(d.grupo0312) || grupo0312(d.trabajadores, d.claseRiesgo);
  const s = $('scrCli');
  s.innerHTML = '<div class="hdr"><a class="back" href="#" data-volver>← Volver a los clientes</a><div class="eyebrow">' + esc(d.nit ? 'NIT ' + d.nit : d.id) + '</div><h1>' + esc(d.nombre) + '</h1><p>' + segHtml(g) + esc([d.trabajadores + ' trabajadores', 'riesgo ' + d.claseRiesgo, d.ciudad].filter(Boolean).join(' · ')) + '</p></div>' +
    '<div class="aviso info">Le aplican ' + esc(UI.textoGrupo(g)) + '.</div>' +
    '<div class="card"><h2>Tareas que le dejaste</h2><div id="cTar"><div class="status-msg">' + (Cli.url(d) ? 'Trayendo del portal del cliente…' : '') + '</div></div>' +
      (Cli.url(d) ? '<button type="button" class="btn amber" id="cNueva">+ Dejar una tarea</button><button type="button" class="btn ghost" id="cStd">📦 Tareas de sus estándares (' + g + ')</button>' : '<div class="aviso amar">Sin servidor del cliente: agrega la URL de su servidor y su clave del portal para dejarle tareas.</div>') + '</div>' +
    '<div class="card"><h2>Visitas</h2><div id="cVis"></div><div class="grid2"><div class="field"><label>Fecha</label><input type="date" id="vF" value="' + UI.hoy() + '"></div><div class="field"><label>Próxima visita</label><input type="date" id="vP" value="' + esc(Festivos.sumarDias(UI.hoy(), 30)) + '"></div></div>' +
      '<div class="field"><textarea id="vN" placeholder="Qué se revisó, compromisos…"></textarea></div><button type="button" class="btn ghost" id="vOk">Anotar visita</button></div>' +
    '<div class="fila-btn"><button type="button" class="btn ghost" id="cEditar">✏️ Datos del cliente</button>' + (sitioCli(d) ? '<a class="btn ghost" href="' + esc(sitioCli(d)) + '" target="_blank" rel="noopener">↗ Abrir su portal</a>' : '') + '</div>' +
    '<button type="button" class="btn ghost" id="cPdf">🖨️ Informe para el cliente (PDF)</button><div id="cHist"></div><div class="status-msg" id="cMsg"></div>';
  pintarVisitas();
  $('cEditar').addEventListener('click', ()=> editarCliente(actual));
  $('vOk').addEventListener('click', anotarVisita);
  $('cPdf').addEventListener('click', pdfCliente);
  if ($('cNueva')) $('cNueva').addEventListener('click', ()=> nuevaTarea());
  if ($('cStd')) $('cStd').addEventListener('click', tareasEstandares);
  $('cHist').appendChild(UI.botonHistorial(d.id, d.nombre));
  show('scrCli');
  if (Cli.url(d)) traerTareas();
}
async function traerTareas(){
  const c = actual, cont = $('cTar');
  if (!navigator.onLine) { cont.innerHTML = '<div class="aviso">Sin conexión.</div>'; return; }
  let r;
  try { r = await Cli.pedirSiHaceFalta(c, ()=> Cli.get(c, { action: 'list', tipo: 'accion,auditoria,empresa' })); }
  catch (e) { cont.innerHTML = '<div class="aviso">No hubo respuesta del servidor del cliente. Revisa la URL.</div>'; return; }
  if (!r.ok) { cont.innerHTML = '<div class="aviso">' + esc(r.error || 'Error') + (r.codigoError === 'CLAVE' ? ' Revisa la clave del portal del cliente.' : '') + '</div>'; return; }
  tareas = r.rows.filter((x)=> x.tipo === 'accion' && x.resumen.origen === ORIGEN).sort((a, b)=> (a.estado === 'CERRADA') - (b.estado === 'CERRADA') || String(a.resumen.fechaCompromiso).localeCompare(String(b.resumen.fechaCompromiso)));
  autoeval = r.rows.filter((x)=> x.tipo === 'auditoria' && /^RES0312/.test(x.resumen.plantilla) && x.estado === 'CERRADA').sort((a, b)=> String(b.resumen.fechaEjecucion).localeCompare(String(a.resumen.fechaEjecucion)))[0] || null;
  // Versión de su servidor (para saber a quién falta actualizar).
  let versionServidor = '';
  try { const pg = await Cli.get(c, { action: 'ping' }); versionServidor = (pg && pg.version) || (pg && pg.ok ? 'anterior a v99' : ''); } catch (e) {}
  const perfil = r.rows.find((x)=> x.tipo === 'empresa' && x.id === 'EMPRESA-PERFIL') || r.rows.find((x)=> x.tipo === 'empresa');
  perfilCli = perfil || null; actual.versionServidor = versionServidor || actual.versionServidor || '';
  pintarTareas(perfil);
  // Se guarda el resumen en tu panel (para la lista y el correo diario).
  const h = UI.hoy(), ab = tareas.filter((x)=> x.estado !== 'CERRADA'), campos = { tareasAbiertas: ab.length, tareasVencidas: ab.filter((x)=> x.resumen.fechaCompromiso && x.resumen.fechaCompromiso < h).length,
    puntaje: autoeval ? Number(autoeval.resumen.puntaje) : '', sincronizado: new Date().toISOString(), versionServidor };
  await SGSST.enviar({ action: 'parche', tipo: 'cliente', id: c.id, campos });
  Object.assign(actual, campos);
}
function pintarTareas(perfil){
  const h = UI.hoy(), c = actual, g = Number(c.grupo0312);
  const aviso = perfil && (Number(perfil.resumen.trabajadores) !== Number(c.trabajadores) || perfil.resumen.claseRiesgo !== c.claseRiesgo)
    ? '<div class="aviso amar">En su portal dice ' + esc(perfil.resumen.trabajadores) + ' trabajadores, riesgo ' + esc(perfil.resumen.claseRiesgo) + ' (le aplicarían ' + esc(perfil.resumen.grupo0312) + ' estándares). <button type="button" class="btn-mini" id="cUsarPerfil">Usar estos datos</button></div>' : '';
  const est = (x)=> x.estado === 'CERRADA' ? (x.resumen.verificada ? ['Verificada', 'ok'] : ['Hecha: por verificar', 'pronto']) : x.resumen.fechaCompromiso && x.resumen.fechaCompromiso < h ? ['Vencida', 'mal'] : x.estado === 'EN PROCESO' ? ['En proceso', 'pronto'] : ['Pendiente', 'gris'];
  const pr = perfil ? perfil.resumen : {}, cs = pr.correoSST || '', ca = pr.correoAsesor || '';
  const correos = '<div class="aviso ' + (cs ? 'info' : 'amar') + '" style="font-size:13px;">📧 ' + (cs ? 'Avisos por correo: las tareas nuevas y los recordatorios llegan a <b>' + esc(cs) + '</b>' + (ca ? '; tú recibes copia y el aviso cuando cierran una (' + esc(ca) + ')' : '') + '.' : 'Avisos por correo sin configurar: el cliente solo ve las tareas cuando entra a su portal.') +
    ' <button type="button" class="btn-mini" id="cCorreos">' + (cs ? 'Cambiar' : 'Configurar') + '</button></div>';

  $('cCorreos').addEventListener('click', ()=> configurarCorreos(perfil));

/* Avisos por correo de las tareas: se guardan en el perfil del cliente (en SU servidor),
   que es quien manda los correos y solo a esas direcciones. */
function configurarCorreos(perfil){
  const c = actual, pr = perfil ? perfil.resumen : {};
  let mio = ''; try { mio = (Sesion.yo() || {}).correo || localStorage.getItem('ssta-correo-asesor') || ''; } catch (e) {}
  const m = UI.modal('<h3>Avisos por correo · ' + esc(c.nombre) + '</h3><p class="ayuda">El servidor de ' + esc(c.nombre) + ' avisa por correo cuando le dejas una tarea, le recuerda las que vencen en 3 días o ya vencieron, y te avisa a ti cuando cierran una para que la verifiques. Necesita que su servidor esté en la versión v98 o posterior.</p>' +
    '<div class="field"><label>Correo del responsable del SG-SST en la empresa *</label><input type="email" id="ccS" value="' + esc(pr.correoSST || c.correo || '') + '" autocapitalize="none"></div>' +
    '<div class="field"><label>Tu correo (copia de los avisos y tareas cerradas)</label><input type="email" id="ccA" value="' + esc(pr.correoAsesor || mio) + '" autocapitalize="none"></div>' +
    '<p class="ayuda">También le llega al usuario del portal del cliente que se llame como el responsable de la tarea, si tiene correo.</p>' +
    '<button type="button" class="btn amber" id="ccOk">Guardar en el portal del cliente</button><button type="button" class="btn ghost" data-cerrar>Cancelar</button><div class="status-msg" id="ccMsg"></div>', true);
  m.el.querySelector('#ccOk').addEventListener('click', async ()=> {
    const v = (id)=> m.el.querySelector(id).value.trim().toLowerCase(), ok = (x)=> !x || /^[^\s@,;]+@[^\s@,;]+\.[^\s@,;]{2,}$/.test(x), msg = m.el.querySelector('#ccMsg');
    const cs = v('#ccS'), ca = v('#ccA');
    if (!cs) { msg.textContent = 'Falta el correo del responsable.'; return; }
    if (!ok(cs) || !ok(ca)) { msg.textContent = 'Revisa los correos.'; return; }
    const campos = { correoSST: cs, correoAsesor: ca };
    // Si el cliente aún no tiene perfil, se crea con los datos de tu panel.
    if (!perfil) Object.assign(campos, { nombre: c.nombre, nit: c.nit || '', actividad: c.actividad || '', trabajadores: Number(c.trabajadores) || '', claseRiesgo: c.claseRiesgo || 'I', grupo0312: Number(c.grupo0312) || grupo0312(c.trabajadores, c.claseRiesgo), fechaActualizacion: UI.hoy() });
    msg.textContent = 'Guardando…';
    const r = await Cli.pedirSiHaceFalta(c, ()=> Cli.post(c, { action: 'parche', tipo: 'empresa', id: 'EMPRESA-PERFIL', campos }));
    if (!r.ok) { msg.textContent = 'No se guardó: ' + (r.error || ''); return; }
    try { if (ca) localStorage.setItem('ssta-correo-asesor', ca); } catch (e) {}
    m.cerrar(); UI.toast('✓ Avisos por correo configurados en el portal del cliente.'); traerTareas();
  });
}
const yo = ()=> Sesion.nombre() || (typeof EMPRESA !== 'undefined' && EMPRESA.nombre) || 'Asesor';
async function cambiarTarea(id, que){
  const c = actual;
  let body;
  if (que === 'verificar') { const n = prompt('Nota de verificación (opcional):', 'Evidencia revisada'); if (n === null) return; body = { action: 'parche', tipo: 'accion', id, campos: { verificada: { fecha: UI.hoy(), por: yo(), nota: n } } }; }
  else if (que === 'reabrir') { const n = prompt('¿Por qué se reabre? (el cliente lo verá en el seguimiento)', ''); if (!n) return;
    body = { action: 'parche', tipo: 'accion', id, campos: { estado: 'ABIERTA', verificada: null }, agregar: { seguimiento: [{ uid: SGSST.nuevoOpId(), fecha: UI.hoy(), quien: yo() + ' (asesor)', texto: 'Reabierta: ' + n }] } }; }
  else { const n = prompt('Anotación para el cliente (queda en el seguimiento de la tarea):', ''); if (!n) return;
    body = { action: 'parche', tipo: 'accion', id, agregar: { seguimiento: [{ uid: SGSST.nuevoOpId(), fecha: UI.hoy(), quien: yo() + ' (asesor)', texto: n }] } }; }
  const r = await Cli.pedirSiHaceFalta(c, ()=> Cli.post(c, body));
  if (!r.ok) { UI.toast('No se guardó: ' + (r.error || ''), 'mal'); return; }
  UI.toast('✓ Guardado en el portal del cliente.'); traerTareas();
}
const PRIORIDADES = ['Alta', 'Media', 'Baja'];

const pendCorreo = ()=> !(perfilCli && perfilCli.resumen.correoSST);

function crearTarea(t){
  const c = actual, h = UI.hoy();
  const doc = { origen: ORIGEN, origenRef: 'ASESOR', estandar: t.estandar || '', hallazgo: (t.estandar ? 'Estándar ' + t.estandar + '. ' : '') + (t.detalle || ''), accion: t.titulo, tipoAccion: 'Preventiva',
    prioridad: t.prioridad || 'Media', responsable: t.responsable, fechaCompromiso: t.fecha || Festivos.sumarDias(h, 30), centro: '', fotos: [], estado: 'ABIERTA', fecha: h, asignadaPor: yo(), seguimiento: [] };
  // En lote, el servidor del cliente manda un solo correo con todas (al llegar la última).
  if (t.lote) Object.assign(doc, { lote: t.lote, loteN: t.loteN, loteI: t.loteI });
  return Cli.pedirSiHaceFalta(c, ()=> Cli.post(c, { action: 'guardar', tipo: 'accion', id: SGSST.nuevoId('ACC'), doc, versionBase: 0 }));

/* Tareas a partir de los estándares que le aplican: los que no cumplió en su última autoevaluación
   (o todos, si aún no la tiene), menos los que ya tienen una tarea abierta. */
async function tareasEstandares(){
  const c = actual, g = Number(c.grupo0312), P = PLANTILLAS_AUDITORIA[g === 60 ? 'RES0312' : 'RES0312_' + g];
  let nc = null;
  if (autoeval) { const d = await Cli.pedirSiHaceFalta(c, ()=> Cli.get(c, { action: 'doc', id: autoeval.id })); if (d.ok) nc = new Set((d.doc.items || []).filter((i)=> i.r === 'NC' || !i.r).map((i)=> i.id)); }
  const abiertas = new Set(tareas.filter((x)=> x.estado !== 'CERRADA').map((x)=> (/^Estándar (\d+(?:\.\d+)*)/.exec(x.resumen.hallazgo || '') || [])[1]).filter(Boolean));
  const m = UI.modal('<h3>Tareas de sus ' + g + ' estándares</h3><p class="ayuda">' + (nc ? 'Marcados: los que no cumplió en su autoevaluación del ' + esc(UI.corta(autoeval.resumen.fechaEjecucion)) + '.' : 'Aún no tiene autoevaluación: están marcados todos.') + ' Los que ya tienen una tarea abierta no se repiten.</p>' +
    P.items.map((i, k)=> { const ya = abiertas.has(i[0]); const marc = !ya && (!nc || nc.has(i[0]));
      return '<label class="std"><input type="checkbox" data-k="' + k + '"' + (marc ? ' checked' : '') + (ya ? ' disabled' : '') + '><div><b>' + esc(i[0]) + '</b> ' + esc(i[4].split(' — ')[0]) + (ya ? ' <small>ya tiene tarea abierta</small>' : '') + '<small>' + esc(i[4].split(' — ').slice(-1)[0]) + '</small></div></label>'; }).join('') +
    '<div class="grid2" style="margin-top:8px;"><div class="field"><label>Responsable</label><input type="text" id="sR" value="' + esc(c.contacto || '') + '"></div><div class="field"><label>Fecha límite</label><input type="date" id="sF" value="' + Festivos.sumarDias(UI.hoy(), 45) + '"></div></div>' +
    '<button type="button" class="btn amber" id="sOk">Dejar las tareas marcadas</button><button type="button" class="btn ghost" data-cerrar>Cancelar</button><div class="status-msg" id="sMsg"></div>', true);
  m.el.querySelector('#sOk').addEventListener('click', async ()=> {
    const sel = [...m.el.querySelectorAll('input[data-k]:checked')].map((x)=> P.items[+x.dataset.k]), resp = m.el.querySelector('#sR').value.trim(), f = m.el.querySelector('#sF').value, msg = m.el.querySelector('#sMsg');
    if (!sel.length || !resp) { msg.textContent = 'Marca al menos un estándar y escribe el responsable.'; return; }
    let n = 0; const lote = 'L' + Date.now().toString(36);

      const r = await crearTarea({ titulo: 'Cumplir el estándar ' + i[0] + ': ' + i[4].split(' — ')[0], detalle: i[4].split(' — ').slice(-1)[0], estandar: i[0], responsable: resp, fecha: f, prioridad: Number(i[3]) >= 4 ? 'Alta' : 'Media', lote, loteN: sel.length, loteI: n + 1 });

async function anotarVisita(){
