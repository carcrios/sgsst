<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#151b24">
<title>Programas de alto riesgo · Portal SSTA</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="common.css">
<link rel="stylesheet" href="sgsst.css">
<style>
/* v107: botones de estado con color (antes no se veía cuál quedaba marcado) */
.seg-btn{flex-wrap:wrap;}
.seg-btn button{min-height:44px;flex:1 1 auto;padding:0 10px;}
.seg-btn button.on{background:var(--ink);border-color:var(--ink);color:#fff;}
.seg-btn button.on[data-v="Cumple"],.seg-btn button.on[data-v="Completo"],.seg-btn button.on[data-v="Bueno"]{background:var(--ok);border-color:var(--ok);color:#fff;}
.seg-btn button.on[data-v="Parcial"],.seg-btn button.on[data-v="Incompleto"],.seg-btn button.on[data-v="Regular"]{background:#e0a400;border-color:#e0a400;color:#151b24;}
.seg-btn button.on[data-v="No cumple"],.seg-btn button.on[data-v="No tiene"],.seg-btn button.on[data-v="Malo"]{background:var(--mal);border-color:var(--mal);color:#fff;}
.seg-btn button.on[data-v="No aplica"]{background:#6b7785;border-color:#6b7785;color:#fff;}
/* filas editables (responsables, inventario, personal, equipos…) */
.filas{display:flex;flex-direction:column;gap:10px;margin:8px 0 4px;}
.fila-ed{border:1px solid var(--line);border-left:5px solid #c8d0d6;border-radius:10px;padding:10px 12px 8px;background:#fcfcfb;}
.fila-ed.ok{border-left-color:var(--ok);} .fila-ed.pronto{border-left-color:#e0a400;} .fila-ed.mal{border-left-color:var(--mal);}
.fila-campos{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:0 10px;}
.fila-campos .field{margin-bottom:8px;min-width:0;}
.fila-campos .fe-l{grid-column:1 / -1;}
.fila-pie{display:flex;align-items:center;gap:8px;border-top:1px dashed #e6eaee;padding-top:8px;}
.fila-pie .chip{white-space:normal;}
.btn-quitar{margin-left:auto;min-height:44px;min-width:92px;padding:0 14px;border:1.5px solid #f0c8c1;background:#fff;color:var(--mal);border-radius:10px;font:700 13.5px/1 inherit;font-family:inherit;cursor:pointer;}
.btn-add{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;min-height:46px;border:1.5px dashed #b9c3cc;background:#fff;border-radius:10px;font:700 14px/1.2 inherit;font-family:inherit;color:var(--ink);cursor:pointer;margin-top:4px;}
.con-otro .otro-txt{margin-top:6px;}
.acciones{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px;}
.acciones .btn{flex:1 1 140px;width:auto;margin:0;}
.acciones.fija{position:sticky;top:0;z-index:20;background:var(--bg,#eef1f4);padding:8px 0;margin-top:-6px;}
.barra{height:10px;border-radius:6px;background:#e6eaee;overflow:hidden;margin:6px 0 2px;}
.barra > i{display:block;height:100%;background:var(--ok);border-radius:6px;}
.barra.pronto > i{background:#e0a400;} .barra.mal > i{background:var(--mal);}
.falta-lista{margin:8px 0 0;padding-left:18px;font-size:13px;line-height:1.5;color:#8a1f12;}
.falta-lista button{background:none;border:0;padding:0;font:inherit;color:inherit;text-decoration:underline;cursor:pointer;text-align:left;}
.card h2 .n{font-size:12px;color:var(--muted);font-weight:600;margin-left:6px;}
.prog-ic{display:inline-flex;width:22px;height:22px;vertical-align:-5px;margin-right:6px;color:var(--ink);}
.prog-ic svg{width:22px;height:22px;}
.hdr .prog-ic{color:#c9a227;}
/* checklist */
.comp{font-family:var(--font-display);font-size:12.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin:16px 0 2px;display:flex;justify-content:space-between;gap:8px;}
.comp span{font-family:inherit;text-transform:none;letter-spacing:0;font-weight:700;}
.elem{border-bottom:1px dashed #e6eaee;padding:9px 0;}
.elem .et{font-size:13.5px;font-weight:600;line-height:1.35;}
.elem .seg-btn{margin-top:6px;}
.elem textarea,.elem input.otro-req{width:100%;box-sizing:border-box;border:1.5px solid var(--line);border-radius:9px;padding:8px;font-size:15px;font-family:inherit;min-height:44px;margin-top:6px;background:#fcfbf8;}
.elem.sin .et::after{content:' · sin evaluar';color:var(--mal);font-weight:700;font-size:11.5px;}
.elem .quitar-otro{margin-top:6px;}
.ind{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:7px 0;border-bottom:1px dashed #e6eaee;font-size:13px;}
.ind b{font-size:15px;}
.ind small{grid-column:1 / span 2;color:var(--muted);font-size:11.5px;}
.field-invalid{border-color:#c0392b !important;background:#fdecea !important;}
</style>
</head>
<body>
<div class="wrap">
<div class="screen active" id="scrLista">
  <div class="hdr">
    <a class="back" href="index.html">← Volver al portal</a>
    <div class="marca-titulo"><span class="marca" role="img" aria-label="INDIMON"></span><div><div class="eyebrow">Planear el SG-SST</div>
    <h1>Programas de alto riesgo</h1>
    <p>Alturas, espacios confinados, eléctrico, caliente, izaje, energías peligrosas, químicos, excavaciones y cargas: requisitos, personal, equipos, rescate e indicadores</p></div></div>
  </div>
  <div id="avisoSrv"></div><div id="avisoCopia"></div>
  <div class="acciones"><button type="button" class="btn ghost" id="pdfTodos">Resumen de los programas (PDF)</button></div>
  <div class="kpis" id="kpis"></div>
  <div id="panel"><div class="empty">Cargando…</div></div>
  <div class="version-portal">Portal SSTA · versión v107</div>
</div>
<div class="screen" id="scrProg"></div>
</div>
<script src="empresa.js"></script>
<script src="config.js"></script>
<script src="common.js"></script>
<script src="valida.js"></script>
<script src="sgsst-ui.js"></script>
<script src="registros.js"></script>
<script>
OfflineBanner.init();
OutboxBadge.init();
if (typeof Outbox !== 'undefined') Outbox.flush();
if (typeof UpdateManager !== 'undefined') UpdateManager.init();

const $ = UI.$;
/* ── v107: utilidades locales («Otro» que deja escribir, filas editables y validación) ── */
const esOtro = (v)=> /^Otr[oa]s?\b/i.test(String(v == null ? '' : v));
/** Lista desplegable que, con «Otro»/«Otra», muestra un campo para escribir cuál. */
function selOtro(attr, ops, val, ph, vacio){
  val = val == null ? '' : String(val);
  const otro = ops.find(esOtro), enLista = ops.some((o)=> String(o) === val), usa = !!otro && val !== '' && (!enLista || esOtro(val));
  const sel = usa ? otro : val;
  return '<div class="con-otro"><select ' + attr + '>' + (vacio ? '<option value="">' + esc(vacio) + '</option>' : '') + ops.map((o)=> '<option' + (String(o) === sel ? ' selected' : '') + '>' + esc(o) + '</option>').join('') + '</select>' +
    (otro ? '<input type="text" class="otro-txt" aria-label="Escribe cuál" placeholder="' + esc(ph || '¿Cuál? Escríbelo aquí') + '" value="' + esc(usa && !esOtro(val) ? val : '') + '"' + (usa ? '' : ' hidden') + '>' : '') + '</div>';
}
/** Valor de una lista con «Otro»: el texto escrito (vacío si falta escribirlo). */
function valSel(s){ const t = s.parentElement && s.parentElement.querySelector('.otro-txt'); return t && esOtro(s.value) ? t.value.trim() : s.value; }
document.addEventListener('change', (e)=> { const s = e.target.closest('.con-otro > select'); if (!s) return; const t = s.parentElement.querySelector('.otro-txt'); if (t) { t.hidden = !esOtro(s.value); if (!t.hidden) t.focus(); } });
/* Filas editables: cols = [{ k, l, t: text|number|date|select|persona|sino, op, req, ph, ancho:'l', despuesDe:'k' }] */
function campoFila(c, v){
  const a = 'data-k="' + c.k + '"';
  if (c.t === 'select') return selOtro(a, c.op, v, c.ph, c.vacio);
  if (c.t === 'sino') return '<select ' + a + '>' + ['', 'Sí', 'No'].map((o)=> '<option value="' + o + '"' + (String(v || '') === o ? ' selected' : '') + '>' + (o || '—') + '</option>').join('') + '</select>';
  if (c.t === 'number') return '<input type="number" min="0" step="any" inputmode="decimal" ' + a + ' value="' + esc(v == null ? '' : v) + '"' + (c.ph ? ' placeholder="' + esc(c.ph) + '"' : '') + '>';
  return '<input type="' + (c.t === 'date' ? 'date' : 'text') + '" ' + a + (c.t === 'persona' ? ' data-persona="1"' : '') + ' value="' + esc(v == null ? '' : v) + '"' + (c.ph ? ' placeholder="' + esc(c.ph) + '"' : '') + '>';
}
function filaHTML(cols, r, estado){
  const e = estado ? estado(r) : null;
  return '<div class="fila-ed ' + (e ? e[0] : '') + '" data-uid="' + esc(r.uid || '') + '"><div class="fila-campos">' + cols.map((c)=> '<div class="field' + (c.ancho === 'l' ? ' fe-l' : '') + '"><label>' + esc(c.l) + (c.req ? ' *' : '') + '</label>' + campoFila(c, r[c.k]) + '</div>').join('') + '</div>' +
    '<div class="fila-pie">' + (e ? '<span class="chip ' + e[0] + '" data-est>' + esc(e[1]) + '</span>' : '') + '<button type="button" class="btn-quitar" data-quitar>Quitar</button></div></div>';
}
function leerFila(el, cols){
  const o = { uid: el.dataset.uid || SGSST.nuevoOpId() };
  cols.forEach((c)=> { const i = el.querySelector('[data-k="' + c.k + '"]'); if (!i) return; o[c.k] = c.t === 'select' ? valSel(i) : c.t === 'number' ? (i.value === '' ? '' : Number(i.value)) : i.value.trim(); });
  return o;
}
/** Monta una lista de filas en cont. Devuelve { leer(), validar(nombre) → [faltas] }. */
function listaFilas(cont, cols, lista, o){
  o = o || {};
  cont.innerHTML = '<div class="filas"></div><button type="button" class="btn-add">+ ' + esc(o.agregar || 'Agregar') + '</button>' + (o.vacio ? '<div class="ayuda" data-vacio>' + esc(o.vacio) + '</div>' : '');
  const caja = cont.querySelector('.filas');
  const vacio = ()=> { const v = cont.querySelector('[data-vacio]'); if (v) v.hidden = !!caja.children.length; };
  const activar = (el)=> {
    el.querySelectorAll('input[data-persona]').forEach((i)=> UI.autocompletar(i, (p)=> { i.value = p.nombre; const ce = el.querySelector('[data-k="cedula"]'), ca = el.querySelector('[data-k="cargo"]'); if (ce && p.cedula) ce.value = p.cedula; if (ca && p.cargo) ca.value = p.cargo; refrescar(el); }));
    el.querySelector('[data-quitar]').addEventListener('click', ()=> { const r = leerFila(el, cols); const lleno = cols.some((c)=> r[c.k] !== '' && r[c.k] != null && c.k !== (o.clavePrincipalVacia || '')); if (lleno && !confirm('¿Quitar esta fila?')) return; el.remove(); vacio(); if (o.alCambiar) o.alCambiar(); });
    el.addEventListener('input', ()=> refrescar(el)); el.addEventListener('change', ()=> refrescar(el));
  };
  const refrescar = (el)=> { if (!o.estado) { if (o.alCambiar) o.alCambiar(); return; } const e = o.estado(leerFila(el, cols)); el.className = 'fila-ed ' + e[0]; const ch = el.querySelector('[data-est]'); if (ch) { ch.className = 'chip ' + e[0]; ch.textContent = e[1]; } if (o.alCambiar) o.alCambiar(); };
  const agregar = (r)=> { caja.insertAdjacentHTML('beforeend', filaHTML(cols, r || {}, o.estado)); activar(caja.lastElementChild); vacio(); };
  (lista || []).forEach((r)=> agregar(r));
  cont.querySelector('.btn-add').addEventListener('click', ()=> { agregar(Object.assign({ uid: SGSST.nuevoOpId() }, o.nueva ? o.nueva() : {})); const f = caja.lastElementChild.querySelector('input,select'); if (f) f.focus(); if (o.alCambiar) o.alCambiar(); });
  vacio();
  return {
    leer: ()=> [...caja.children].map((el)=> leerFila(el, cols)),
    validar: (nombre)=> { const faltas = [];
      [...caja.children].forEach((el, n)=> { const r = leerFila(el, cols), q = (k)=> el.querySelector('[data-k="' + k + '"]');
        const marca = (k, t)=> { const i = q(k); const x = i && i.parentElement.querySelector('.otro-txt:not([hidden])') && esOtro(i.value) ? i.parentElement.querySelector('.otro-txt') : i; if (x) x.classList.add('field-invalid'); faltas.push({ t: nombre + ' ' + (n + 1) + ': ' + t, el: x }); };
        cols.forEach((c)=> { const i = q(c.k); if (!i) return;
          if (c.t === 'select' && esOtro(i.value) && !r[c.k]) marca(c.k, 'escribe cuál en «' + c.l + '»');
          else if (c.req && (r[c.k] === '' || r[c.k] == null)) marca(c.k, 'falta «' + c.l + '»');
          if (c.t === 'number' && r[c.k] !== '' && Number(r[c.k]) < 0) marca(c.k, '«' + c.l + '» no puede ser negativo');
          if (c.despuesDe && r[c.k] && r[c.despuesDe] && r[c.k] < r[c.despuesDe]) marca(c.k, '«' + c.l + '» no puede ser antes de «' + (cols.find((x)=> x.k === c.despuesDe) || {}).l + '»');
          if (c.k === 'cedula' && r[c.k] && !/^\d{4,12}$/.test(r[c.k])) marca(c.k, 'la cédula va solo con números'); });
      });
      return faltas; }
  };
}
/** Muestra «qué falta» (con enlace a cada campo) y lleva al primero. */
function mostrarFaltas(caja, faltas){
  if (!faltas.length) { caja.innerHTML = ''; return; }
  caja.innerHTML = '<div class="aviso"><b>Falta completar ' + faltas.length + ' cosa(s):</b><ul class="falta-lista">' + faltas.slice(0, 12).map((f, i)=> '<li><button type="button" data-f="' + i + '">' + esc(f.t) + '</button></li>').join('') + (faltas.length > 12 ? '<li>… y ' + (faltas.length - 12) + ' más</li>' : '') + '</ul></div>';
  caja.querySelectorAll('[data-f]').forEach((b)=> b.addEventListener('click', ()=> { const el = faltas[+b.dataset.f].el; if (el) { el.scrollIntoView({ block: 'center' }); if (el.focus) el.focus(); } }));
  caja.scrollIntoView({ block: 'center' });
}
const limpiarMarcas = (raiz)=> raiz.querySelectorAll('.field-invalid').forEach((x)=> x.classList.remove('field-invalid'));
const estadoVence = (vence, txtOk)=> { const c = vence ? UI.semaforo(vence, 30) : 'gris'; return [c, c === 'mal' ? 'Vencido ' + UI.corta(vence) : c === 'pronto' ? 'Vence ' + UI.corta(vence) : c === 'ok' ? (txtOk || 'Vigente') + ' hasta ' + UI.corta(vence) : 'Sin fecha de vencimiento']; };

/* Íconos de línea (sin emojis) */
const IC = {
  alturas: '<path d="M4 20h16M7 20V9l5-5 5 5v11M12 4v6M10 14h4"/>', confinados: '<ellipse cx="12" cy="6" rx="7" ry="2.5"/><path d="M5 6v12c0 1.4 3.1 2.5 7 2.5s7-1.1 7-2.5V6M12 9v8M9.5 14.5 12 17l2.5-2.5"/>',
  electrico: '<path d="M13 2 4 14h7l-1 8 9-12h-7z"/>', caliente: '<path d="M12 3c1 4 5 5 5 10a5 5 0 0 1-10 0c0-2.5 1.5-3.5 2-6 1.5 1 2.5 2.5 2.5 4.5"/>',
  izajes: '<path d="M4 21h6M7 21V4h12M7 8l4-4M19 4v6M17 10h4v4h-4z"/>', loto: '<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4M12 15v2"/>',
  quimicos: '<path d="M9 3h6M10 3v6L5 18a2 2 0 0 0 1.8 3h10.4A2 2 0 0 0 19 18l-5-9V3M7.5 14h9"/>', excavaciones: '<path d="M3 20h18M5 20l3-8h8l3 8M10 12V5l4 2-4 2"/>',
  cargas: '<rect x="6" y="9" width="12" height="9" rx="1"/><path d="M9 9V6h6v3M4 21h16"/>'
};
const icono = (k)=> '<span class="prog-ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' + (IC[k] || IC.alturas) + '</svg></span>';

/* Componentes mínimos de cada programa (orden en que se muestran) */
const COMP = { P: 'Programa y responsables', I: 'Inventario de tareas y sitios', D: 'Procedimientos y permisos', C: 'Controles en el sitio', K: 'Personal, capacitación y aptitud', E: 'Equipos e inspección', R: 'Rescate y emergencias', S: 'Seguimiento e indicadores' };
/* Requisitos de cada programa: [componente, texto]. Los primeros de alturas, confinados, eléctrico,
   caliente e izajes van en el mismo orden de antes (las evaluaciones guardadas siguen en su sitio);
   los nuevos se agregan al final. Guía práctica: verifícala con el texto vigente de cada norma. */
const PROGRAMAS = {
  alturas: { nombre: 'Protección contra caídas (trabajo en alturas)', norma: 'Res. 4272 de 2021', req: 'alturas', permiso: 'permiso-trabajo-alturas.html',
    equipos: ['arnes', 'escalera', 'andamio'], palabras: /altura|ca[ií]da|rescate en altura|andamio|escalera/i, simRescate: true,
    roles: ['Empleador / representante legal', 'Coordinador de trabajo en alturas', 'Persona competente para inspección de equipos', 'Responsable del plan de rescate', 'Entrenador en alturas', 'Jefe de área', 'Otro'],
    certs: ['Trabajador autorizado (nivel avanzado)', 'Trabajador autorizado (nivel básico)', 'Jefe de área (nivel administrativo)', 'Coordinador de trabajo en alturas', 'Reentrenamiento', 'Rescatista', 'Persona competente en inspección', 'Otro'],
    equiposLista: ['Arnés de cuerpo completo', 'Eslinga con absorbedor de energía', 'Eslinga de posicionamiento', 'Línea de vida vertical', 'Línea de vida horizontal', 'Arrestador / freno', 'Conector (mosquetón)', 'Punto de anclaje', 'Escalera', 'Andamio', 'Kit de rescate', 'Casco con barbuquejo', 'Otro'],
    inventarioPh: 'Ej: mantenimiento de cubierta bodega 2 (6 m)',
    elementos: [['P', 'Programa de prevención y protección contra caídas, documentado y firmado'], ['P', 'Coordinador de trabajo en alturas designado y con su curso vigente'],
      ['I', 'Tareas y sitios con riesgo de caída (desde 2 m) identificados en la matriz de peligros'], ['D', 'Procedimiento de trabajo seguro para cada tarea en alturas'],
      ['D', 'Permiso de trabajo y ATS antes de cada tarea'], ['C', 'Medidas de prevención: barandas, control de acceso, delimitación y señalización'],
      ['E', 'Sistemas de protección contra caídas y puntos de anclaje certificados'], ['E', 'Inspección de equipos: antes de cada uso y anual por persona competente'],
      ['R', 'Plan de rescate en alturas con equipos y personal entrenado'], ['K', 'Personal capacitado y certificado en el nivel que exige su tarea, con reentrenamiento'],
      ['K', 'Aptitud médica para trabajo en alturas (concepto, sin diagnósticos)'], ['C', 'Medidas colectivas de prevención priorizadas sobre la protección individual'],
      ['K', 'Contratistas que trabajan en alturas verificados (certificados, seguridad social y equipos)'], ['S', 'Indicadores del programa medidos y analizados'],
      ['S', 'Revisión anual del programa y actualización tras accidentes o cambios']] },
  confinados: { nombre: 'Trabajo en espacios confinados', norma: 'Res. 0491 de 2020', req: 'confinados', permiso: 'permiso-espacios-confinados.html',
    equipos: [], palabrasEquipo: /gases|detector|tr[ií]pode|ventilador|extractor/i, palabras: /confinad|tanque|pozo|alcantarill|silo/i, simRescate: true,
    roles: ['Administrador del programa', 'Supervisor de entrada', 'Vigía', 'Persona competente en mediciones', 'Rescatista', 'Otro'],
    certs: ['Entrante', 'Vigía', 'Supervisor de entrada', 'Rescatista', 'Administrador del programa', 'Reentrenamiento', 'Otro'],
    equiposLista: ['Detector multigás', 'Ventilador / extractor', 'Trípode de rescate', 'Malacate / sistema de recuperación', 'Arnés de cuerpo completo', 'Equipo de respiración autónomo', 'Línea de vida', 'Radio de comunicación', 'Iluminación antiexplosiva', 'Otro'],
    inventarioPh: 'Ej: tanque de agua 1 (con permiso)',
    elementos: [['P', 'Programa de gestión para trabajo en espacios confinados'], ['I', 'Inventario y clasificación de los espacios confinados, señalizados'],
      ['P', 'Supervisor de entrada y vigía designados y capacitados'], ['D', 'Permiso de entrada con medición de la atmósfera (oxígeno, explosividad y tóxicos)'],
      ['E', 'Equipos de medición calibrados y con prueba de respuesta antes de usarlos'], ['C', 'Ventilación, aislamiento y bloqueo de energías y fluidos'],
      ['R', 'Plan de rescate específico con equipos y personal entrenado'], ['K', 'Capacitación de entrantes, vigías y supervisores'], ['K', 'Aptitud médica de quienes entran (concepto, sin diagnósticos)'],
      ['P', 'Administrador del programa de espacios confinados designado'], ['I', 'Evaluación de los riesgos de cada espacio antes de la entrada'],
      ['C', 'Control de acceso: entradas bloqueadas y registro de entrantes y salientes'], ['C', 'Comunicación permanente entre el vigía y los entrantes'],
      ['E', 'Equipos de entrada y rescate (trípode, arnés, línea de vida, respiración) inspeccionados'], ['S', 'Indicadores y revisión anual del programa']] },
  electrico: { nombre: 'Riesgo eléctrico', norma: 'RETIE (Res. 40117 de 2024 y ajustes) · Res. 5018 de 2019', req: 'electrico', permiso: 'permiso-trabajo-electrico.html',
    equipos: ['herramienta_electrica', 'electrica'], palabras: /el[eé]ctric|descarga|arco|tensi[oó]n|electrocu/i,

/** Permisos de cada tipo en los últimos 30 días (de los servidores de permisos, si están). */
async function cargarPermisos(){
  if (typeof getPermitBackends !== 'function' || !navigator.onLine) return;
  const desde = Festivos.sumarDias(UI.hoy(), -30);
  await Promise.all(Object.keys(PROGRAMAS).map(async (k)=> {
    const B = PORTAL_CONFIG.BACKENDS[k]; if (!B || !B.url || (typeof Empresa !== 'undefined' && !Empresa.moduloActivo(k))) return;
    try {
      const res = await fetchWithRetry(B.url + '?' + (B.listQuery || 'list=1') + '&token=' + encodeURIComponent(PORTAL_CONFIG.API_TOKEN));
      const j = await res.json(); if (!j || !j.ok) return;
      const l = (j.rows || []).filter((x)=> String(x.openedAt || x.updatedAt || '').slice(0, 10) >= desde);
      permisos[k] = { total: l.length, abiertos: (j.rows || []).filter((x)=> x.status === 'ABIERTO').length };
    } catch (e) { /* sin servidor de permisos: no se muestra */ }
  }));
  pintar();
}

function progDe(k){ return de('programa').find((x)=> x.resumen.programa === k); }
const claseCump = (c)=> c >= 90 ? 'ok' : c >= 60 ? 'pronto' : 'mal';
function pintar(){

    UI.seccion('PLAN DE RESCATE Y EMERGENCIAS', UI.tablaDatos([['Plan', v.rescate.estado || '—'], ['Actualizado', UI.corta(v.rescate.fecha || '')], ['Personas entrenadas', String(v.rescate.personas === '' || v.rescate.personas == null ? '—' : v.rescate.personas)], ['Tiempo de respuesta', v.rescate.tiempo === '' || v.rescate.tiempo == null ? '—' : v.rescate.tiempo + ' min'], ['Equipos de rescate', v.rescate.equipos || '—']])) +
    UI.seccion('INDICADORES', tabla(['Indicador', 'Valor', 'Detalle'], ind.map((i)=> [i.n, i.v, i.d]))) +
    UI.seccion('LISTA DE CHEQUEO DE CUMPLIMIENTO', tabla(['Componente', 'Requisito', 'Estado', 'Evidencia'], req)) +
    UI.seccion('FIRMAS', '<table><tr><td style="height:60px;vertical-align:bottom;width:50%;">______________________________<br>Firma · Coordinador del programa<br>' + esc(v.coordinador || '') + '</td><td style="height:60px;vertical-align:bottom;">______________________________<br>Firma · Representante legal o empleador</td></tr></table>')]);
}
function pdfResumen(){
  const ks = Object.keys(PROGRAMAS);
  UI.imprimir([UI.cabecera('SG-PROGRAMA-ALTO-RIESGO', 'PROGRAMAS DE TAREAS DE ALTO RIESGO', 'Corte ' + UI.corta(UI.hoy())) +
    '<table><tr><td class="l">Programa</td><td class="l">Norma</td><td class="l">Coordinador</td><td class="l">Cumplimiento</td><td class="l">Personal vigente</td><td class="l">Equipos al día</td><td class="l">Simulacros 12 m</td><td class="l">Eventos 12 m</td><td class="l">Próxima revisión</td></tr>' +
    ks.map((k)=> { const x = progDe(k), P = PROGRAMAS[k], ind = indicadores(k), g = (c)=> (ind.find((i)=> i.c === c) || {}).v || '—';
      return '<tr><td>' + esc(P.nombre) + '</td><td>' + esc(P.norma) + '</td><td>' + esc(x ? x.resumen.coordinador : '') + '</td><td>' + (x ? (x.estado === 'NO APLICA' ? 'No aplica' : esc(x.resumen.cumplimiento) + '%') : 'Sin evaluar') + '</td>' +
        '<td>' + esc(g('personalProg')) + '</td><td>' + esc(g('equipos')) + '</td><td>' + esc(g('simulacros')) + '</td><td>' + esc(g('eventos')) + '</td><td>' + esc(x ? UI.corta(x.resumen.proximaRevision) : '') + '</td></tr>'; }).join('') + '</table>'], true);
}
document.addEventListener('click', (e)=>{ const v = e.target.closest('[data-volver]'); if (v) { e.preventDefault(); show('scrLista'); pintar(); } });
window.addEventListener('outbox-enviado', ()=> cargar());
cargar();
</script>
