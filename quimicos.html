<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#151b24">
<title>Sustancias químicas · Portal SSTA</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="common.css">
<link rel="stylesheet" href="sgsst.css">
<style>
.pics{display:flex;flex-wrap:wrap;gap:2px 8px;margin:6px 0 2px;padding-left:4px;}
.pic{width:24px;height:24px;transform:rotate(45deg);border:2.5px solid #d62718;background:#fff;border-radius:2px;display:inline-flex;align-items:center;justify-content:center;margin:5px 3px;flex:none;}
.pic span{transform:rotate(-45deg);font-size:12px;line-height:1;font-weight:900;color:#151b24;}
.pic.grande{width:34px;height:34px;margin:8px 6px;} .pic.grande span{font-size:17px;}
.lugar{margin-bottom:14px;}
.lugar h3{font-size:15px;margin:0 0 6px;}
.par{border-radius:10px;padding:8px 10px;margin:6px 0;font-size:13px;line-height:1.35;}
.par.N{background:#fdecea;color:#7c2418;} .par.P{background:#fff6d9;color:#6b4d00;}
.par b{display:block;margin-bottom:2px;}
.mx-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;}
.mx{border-collapse:collapse;font-size:11px;background:#fff;}
.mx th,.mx td{border:1px solid var(--line);padding:4px;text-align:center;min-width:30px;}
.mx th.r{text-align:left;white-space:nowrap;font-weight:700;position:sticky;left:0;background:#fff;z-index:1;box-shadow:1px 0 0 var(--line);}
.mx td.S{background:#dff3e6;color:#1d6b43;} .mx td.P{background:#fff6d9;color:#7a5800;} .mx td.N{background:#fbe0dc;color:#9b2c1f;font-weight:800;}
.req{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px;line-height:1.35;}
.req:last-child{border-bottom:0;}
.req .e{flex:none;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;}
.req .e.ok{background:#dff3e6;color:#1d6b43;} .req .e.mal{background:#fbe0dc;color:#9b2c1f;}
.req small{display:block;color:var(--muted);margin-top:2px;}
.picsel{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px;}
.picsel button{display:flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:4px 8px 4px 2px;font:inherit;font-size:12px;font-weight:600;text-align:left;cursor:pointer;color:var(--ink);}
.picsel button.on{border-color:#d62718;background:#fff5f4;}
</style>
</head>
<body>
<div class="wrap">
<div class="screen active" id="scrLista">
  <div class="hdr">
    <a class="back" href="index.html">← Volver al portal</a>
    <div class="marca-titulo"><span class="marca" role="img" aria-label="INDIMON"></span><div><div class="eyebrow">Gestión SST · Riesgo químico</div>
    <h1>Sustancias químicas</h1>
    <p>Inventario con el SGA, fichas de datos de seguridad, compatibilidad de almacenamiento y Res. 773 de 2021</p></div></div>
  </div>
  <div id="avisoSrv"></div><div id="avisoCopia"></div>
  <div class="kpis" id="kpis"></div>
  <div class="tabs" id="tabs">

    <button type="button" data-tab="almacen">Almacenamiento <span class="n" id="nAlm">0</span></button>
    <button type="button" data-tab="gestion">Res. 773 <span class="n" id="nGes">0</span></button>
  </div>
  <div id="panel"><div class="empty">Cargando…</div></div>
  <div class="version-portal">Portal SSTA · versión v104</div>
</div>

<script>
OfflineBanner.init();
OutboxBadge.init();
if (typeof Outbox !== 'undefined') Outbox.flush();
if (typeof UpdateManager !== 'undefined') UpdateManager.init();

const $ = UI.$;
/* Pictogramas del SGA (los mismos nombres que usaba la matriz de peligros: los
   registros viejos siguen sirviendo). El dibujo es una referencia visual; la
   etiqueta del producto manda. */
const PICTOS = [
  { n: 'Explosivo', c: 'EXP', s: '💥', g: 'GHS01' }, { n: 'Inflamable', c: 'INF', s: '🔥', g: 'GHS02' }, { n: 'Comburente', c: 'COM', s: '◎', g: 'GHS03' },
  { n: 'Gas a presión', c: 'GAS', s: '🛢', g: 'GHS04' }, { n: 'Corrosivo', c: 'COR', s: '🧪', g: 'GHS05' }, { n: 'Toxicidad aguda', c: 'TOX', s: '☠', g: 'GHS06' },
  { n: 'Irritante / nocivo', c: 'IRR', s: '!', g: 'GHS07' }, { n: 'Peligro grave para la salud', c: 'SAL', s: '✸', g: 'GHS08' }, { n: 'Peligro para el medio ambiente', c: 'AMB', s: '🐟', g: 'GHS09' }];
const PIC = {}; PICTOS.forEach((p)=> { PIC[p.n] = p; PIC[p.c] = p; });
/* Matriz de compatibilidad de almacenamiento por pictograma (referencia de buenas
   prácticas; no la fija la Res. 773). S: pueden ir juntos · P: con precaución
   (separar con distancia, bandejas o estantes distintos) · N: no juntos.
   Siempre se confirma con las secciones 7 (almacenamiento) y 10 (reactividad) de cada FDS. */
const COD = ['EXP', 'INF', 'COM', 'GAS', 'COR', 'TOX', 'IRR', 'SAL', 'AMB'];
const MX = {
  EXP: { EXP: 'P', INF: 'N', COM: 'N', GAS: 'N', COR: 'N', TOX: 'N', IRR: 'N', SAL: 'N', AMB: 'N' },
  INF: { INF: 'S', COM: 'N', GAS: 'P', COR: 'P', TOX: 'N', IRR: 'S', SAL: 'S', AMB: 'S' },
  COM: { COM: 'S', GAS: 'P', COR: 'P', TOX: 'N', IRR: 'P', SAL: 'P', AMB: 'S' },
  GAS: { GAS: 'S', COR: 'P', TOX: 'P', IRR: 'S', SAL: 'S', AMB: 'S' },
  COR: { COR: 'S', TOX: 'P', IRR: 'S', SAL: 'S', AMB: 'S' },
  TOX: { TOX: 'S', IRR: 'S', SAL: 'S', AMB: 'S' }, IRR: { IRR: 'S', SAL: 'S', AMB: 'S' }, SAL: { SAL: 'S', AMB: 'S' }, AMB: { AMB: 'S' } };
const mx = (a, b)=> (MX[a] && MX[a][b]) || (MX[b] && MX[b][a]) || 'S';
const POR_QUE = {
  'EXP': 'Los explosivos van en un área exclusiva, aparte de todo lo demás.',
  'EXP-EXP': 'Solo explosivos compatibles entre sí, según el fabricante.',
  'INF-COM': 'El comburente aporta oxígeno: aviva o inicia el fuego del inflamable.',
  'INF-TOX': 'En un incendio, el tóxico se dispersa con el humo: sepáralos.',
  'COM-TOX': 'El comburente puede reaccionar con el tóxico y liberarlo en un incendio.',
  'INF-GAS': 'Los cilindros van aparte, asegurados con cadena y lejos de calor e inflamables.',
  'COM-GAS': 'Los cilindros van aparte, asegurados y lejos de oxidantes.',
  'INF-COR': 'Muchos corrosivos reaccionan con inflamables: estantes o bandejas distintas.',
  'COM-COR': 'Oxidantes y corrosivos pueden reaccionar: estantes o bandejas distintas.',
  'GAS-COR': 'Los vapores corrosivos dañan válvulas y cilindros: separa con distancia.',
  'GAS-TOX': 'Una fuga combinada agrava la exposición: separa con distancia o barrera.',
  'COR-TOX': 'Pueden reaccionar entre sí: separa con bandejas o estantes distintos.',
  'COM-IRR': 'Revisa la sección 10 de la ficha: algunos reaccionan con oxidantes.',
  'COM-SAL': 'Revisa la sección 10 de la ficha: algunos reaccionan con oxidantes.',
  'ACIDO-BASE': 'Ácidos y bases reaccionan con violencia (calor y salpicaduras): estantes o bandejas separadas.' };
const VIGENCIA_FDS_MESES = 60;   // Res. 773 de 2021, art. 18: revisar la FDS como máximo cada 5 años

const C_SUS = [{ k: 'nombre', l: 'Nombre comercial', req: true }, { k: 'fabricante', l: 'Fabricante / proveedor', medio: true }, { k: 'uso', l: 'Uso', medio: true, ph: 'Ej: desengrase de piezas' },
  { k: 'area', l: 'Área o proceso donde se usa', medio: true }, { k: 'ubicacion', l: 'Dónde se almacena', medio: true, req: true, ph: 'Ej: Bodega de químicos', ayuda: 'Escríbelo igual en todas: así se revisa qué queda junto.' },
  { k: 'estadoFisico', l: 'Estado físico', t: 'select', vacio: true, op: ['Líquido', 'Sólido', 'Gas', 'Aerosol', 'Pasta / gel'], medio: true }, { k: 'cantidad', l: 'Cantidad máxima almacenada', medio: true, ph: 'Ej: 4 galones' },
  { k: 'cas', l: 'N.º CAS (sustancia principal)', medio: true }, { k: 'onu', l: 'N.º ONU (transporte)', medio: true },
  { k: 'pictogramas', l: 'Pictogramas del SGA (como en la etiqueta)', t: 'picts' },
  { k: 'palabra', l: 'Palabra de advertencia', t: 'select', vacio: true, op: ['Peligro', 'Atención', 'Sin palabra de advertencia'], medio: true },
  { k: 'corrosivoTipo', l: 'Si es corrosivo: ¿ácido o base?', t: 'select', op: [['', '— No aplica / no sé —'], ['Ácido', 'Ácido'], ['Base', 'Base (álcali)']], medio: true, ayuda: 'Ácidos y bases no se almacenan juntos.' },
  { k: 'frasesH', l: 'Indicaciones de peligro (frases H)', ph: 'Ej: H225, H319, H336' },
  { k: 'carcinogena', l: 'Carcinógena, mutágena o tóxica para la reproducción (prioritaria, estándar 4.1.3)', t: 'check' }, { k: 'toxicidadAguda', l: 'Toxicidad aguda (prioritaria, estándar 4.1.3)', t: 'check' },
  { k: 'hojaSeguridad', l: '¿Tiene ficha de datos de seguridad (16 secciones) en el sitio?', t: 'select', op: ['Sí', 'No'], medio: true },
  { k: 'fdsEspanol', l: '¿La ficha está en español?', t: 'select', vacio: true, op: ['Sí', 'No'], medio: true },
  { k: 'fechaHoja', l: 'Fecha de la ficha (emisión o revisión)', t: 'date', medio: true }, { k: 'venceHoja', l: 'Próxima revisión de la ficha', t: 'date', medio: true, ayuda: 'Vacía: 5 años después de la fecha de la ficha (Res. 773 de 2021, art. 18), o antes si el proveedor la actualiza.' },
  { k: 'etiquetaSGA', l: 'Etiqueta del envase', t: 'select', vacio: true, op: ['Conforme al SGA', 'Incompleta', 'Sin etiqueta'], medio: true }, { k: 'expuestos', l: 'Trabajadores expuestos', t: 'number', medio: true },
  { k: 'trasvasa', l: 'Se trasvasa a envases secundarios', t: 'check' }, { k: 'envasesRotulados', l: 'Los envases secundarios están rotulados', t: 'check' },
  { k: 'epp', l: 'EPP según la ficha (sección 8)', ph: 'Ej: guantes de nitrilo, monogafas, respirador con cartucho para vapores orgánicos' },
  { k: 'controles', l: 'Controles (sustitución, ventilación, almacenamiento, procedimientos)', t: 'textarea' }, { k: 'estado', l: 'Estado', t: 'select', op: ['En uso', 'Fuera de uso'] }];
const C_GES = [{ k: 'responsable', l: 'Responsable del programa de riesgo químico', t: 'persona' },
  { k: 'capacitacionSGA', l: 'Última capacitación en SGA (etiquetas, pictogramas y fichas)', t: 'date', medio: true }, { k: 'capacitados', l: 'Personas capacitadas', t: 'number', medio: true },
  { k: 'proximaCapacitacion', l: 'Próxima capacitación', t: 'date', ayuda: 'Vacía: un año después de la última (Res. 773 de 2021, art. 21: mínimo una vez al año).' },
  { k: 'inventarioRevisado', l: 'Última revisión completa del inventario', t: 'date' },
  { k: 'senalizacion', l: 'Áreas de almacenamiento y uso señalizadas con sus peligros', t: 'check' },
  { k: 'fdsDisponibles', l: 'Fichas disponibles para consulta en los sitios de uso (física o digital)', t: 'check' },
  { k: 'kitDerrames', l: 'Kit antiderrames y elementos para emergencias químicas', t: 'check' },
  { k: 'lavaojos', l: 'Ducha o lavaojos donde se manejan corrosivos o irritantes', t: 'check' },
  { k: 'procedimiento', l: 'Procedimiento de respuesta a derrames y exposiciones', t: 'check' }];
const ID_GES = 'QUIMICOS-GESTION';
let rows = [], tab = 'inventario';
const de = (t)=> rows.filter((x)=> x.tipo === t);
const enUso = ()=> de('sustancia').filter((x)=> x.resumen.estado !== 'Fuera de uso');
const clases = (r)=> String(r.pictogramas || '').split(/\s*,\s*/).map((n)=> (PIC[n] || {}).c).filter(Boolean);
const picHtml = (r, grande)=> clases(r).map((c)=> '<span class="pic' + (grande ? ' grande' : '') + '" title="' + esc(PIC[c].n) + '"><span>' + PIC[c].s + '</span></span>').join('');
async function cargar(){
  if (UI.avisoServidor($('avisoSrv'))) { $('panel').innerHTML = ''; return; }
  const r = await SGSST.listar('sustancia,gestquim,accion');
  UI.avisoCopia($('avisoCopia'), r);
  rows = r.rows; pintar();
}
/* ── Estado de cada sustancia ── */
function problemas(x){
  const s = x.resumen, h = UI.hoy(), l = [];
  if (s.hojaSeguridad !== 'Sí') l.push('Sin ficha de datos de seguridad');
  else if (s.venceHoja && s.venceHoja < h) l.push('Ficha para revisar desde ' + UI.corta(s.venceHoja));
  else if (s.fdsEspanol === false || s.fdsEspanol === 'No') l.push('Ficha que no está en español');
  if (!s.etiquetaSGA) l.push('Etiqueta sin revisar');
  else if (s.etiquetaSGA !== 'Conforme al SGA') l.push('Etiqueta ' + s.etiquetaSGA.toLowerCase());
  if (s.trasvasa === true && s.envasesRotulados !== true) l.push('Envases secundarios sin rotular');
  if (!clases(s).length) l.push('Sin pictogramas registrados');
  return l;
}
const prioritaria = (s)=> s.carcinogena === true || s.toxicidadAguda === true;
/* ── Compatibilidad: por lugar de almacenamiento, cada par de sustancias ── */
function compatPar(a, b){
  const ca = clases(a.resumen), cb = clases(b.resumen); let peor = 'S', motivos = [];
  const subir = (v, k)=> { if (v === 'S') return; if (v === 'N') peor = 'N'; else if (peor !== 'N') peor = 'P'; const t = POR_QUE[k] || POR_QUE[k.split('-').reverse().join('-')]; if (t && !motivos.includes(t)) motivos.push(t); };
  ca.forEach((x)=> cb.forEach((y)=> { const v = mx(x, y); const k = x === 'EXP' || y === 'EXP' ? (x === y ? 'EXP-EXP' : 'EXP') : [x, y].sort((p, q)=> COD.indexOf(p) - COD.indexOf(q)).join('-'); subir(v, k); }));
  const ta = a.resumen.corrosivoTipo, tb = b.resumen.corrosivoTipo;
  if (ta && tb && ta !== tb) subir('N', 'ACIDO-BASE');
  return { v: peor, motivos };
}
function lugares(){
  const g = {};
  enUso().forEach((x)=> { const n = String(x.resumen.ubicacion || '').trim(), k = UI.norm(n) || '(sin lugar)'; (g[k] = g[k] || { nombre: n || 'Sin lugar de almacenamiento', l: [] }).l.push(x); });
  return Object.values(g).map((L)=> {
    const pares = [];
    for (let i = 0; i < L.l.length; i++) for (let j = i + 1; j < L.l.length; j++) { const c = compatPar(L.l[i], L.l[j]); if (c.v !== 'S') pares.push({ a: L.l[i], b: L.l[j], v: c.v, motivos: c.motivos }); }
    pares.sort((p, q)=> (p.v === 'N' ? 0 : 1) - (q.v === 'N' ? 0 : 1));
    return Object.assign(L, { pares, n: pares.filter((p)=> p.v === 'N').length });
  }).sort((a, b)=> b.n - a.n || a.nombre.localeCompare(b.nombre));
}
/* ── Requisitos de la Res. 773 de 2021 (texto vigente: verifícalo en la norma) ── */
function gestion(){ return de('gestquim').find((x)=> x.id === ID_GES); }
function requisitos(){
  const g = (gestion() || {}).resumen || {}, h = UI.hoy(), hace12 = Festivos.sumarMeses(h, -12), u = enUso(), lg = lugares();
  const sinFds = u.filter((x)=> x.resumen.hojaSeguridad !== 'Sí').length, fdsViejas = u.filter((x)=> x.resumen.hojaSeguridad === 'Sí' && x.resumen.venceHoja && x.resumen.venceHoja < h).length;
  const sinEtq = u.filter((x)=> x.resumen.etiquetaSGA !== 'Conforme al SGA').length, sinRot = u.filter((x)=> x.resumen.trasvasa === true && x.resumen.envasesRotulados !== true).length;
  const incompat = lg.reduce((a, L)=> a + L.n, 0), hayCorr = u.some((x)=> clases(x.resumen).some((c)=> c === 'COR' || c === 'IRR'));
  const prio = u.filter((x)=> prioritaria(x.resumen)), prioSinCtl = prio.filter((x)=> !String(x.resumen.controles || '').trim()).length;
  return [
    { ok: u.length > 0 && !!g.inventarioRevisado && g.inventarioRevisado >= hace12, t: 'Inventario actualizado de los productos químicos y sus peligros', a: 'Art. 21', d: u.length ? u.length + ' en uso · ' + (g.inventarioRevisado ? 'revisado el ' + UI.corta(g.inventarioRevisado) : 'falta anotar la revisión completa del inventario') : 'Sin sustancias en el inventario', btn: 'inv' },
    { ok: u.length > 0 && !sinFds && !sinEtq && !sinRot, t: 'Productos con etiqueta del SGA y ficha de datos de seguridad', a: 'Art. 21', d: [sinFds ? sinFds + ' sin ficha' : '', sinEtq ? sinEtq + ' con etiqueta incompleta, sin etiqueta o sin revisar' : '', sinRot ? sinRot + ' con envases secundarios sin rotular' : ''].filter(Boolean).join(' · ') || 'Todas con ficha y etiqueta' },
    { ok: u.length > 0 && !fdsViejas, t: 'Fichas revisadas como máximo cada 5 años (antes si hay información nueva)', a: 'Art. 18', d: fdsViejas ? fdsViejas + ' ficha(s) para revisar' : 'Ninguna ficha vencida' },
    { ok: g.fdsDisponibles === true, t: 'Fichas disponibles para consulta de los trabajadores en todo momento', a: 'Art. 21', d: g.fdsDisponibles === true ? 'Sí' : 'Sin confirmar' },
    { ok: g.senalizacion === true, t: 'Señalización de los productos y áreas con sus peligros y medidas de seguridad', a: 'Art. 21', d: g.senalizacion === true ? 'Sí' : 'Sin confirmar' },
    { ok: !!g.capacitacionSGA && g.capacitacionSGA >= hace12, t: 'Capacitación en el SGA (etiquetas, pictogramas, fichas) por lo menos una vez al año', a: 'Art. 21', d: g.capacitacionSGA ? 'Última: ' + UI.corta(g.capacitacionSGA) + (g.capacitados ? ' · ' + g.capacitados + ' persona(s)' : '') : 'Sin capacitación registrada' },
    { ok: g.kitDerrames === true && (g.lavaojos === true || !hayCorr) && g.procedimiento === true, t: 'Elementos y procedimiento para atender emergencias químicas', a: 'Art. 21', d: [g.kitDerrames === true ? 'kit antiderrames ✓' : 'falta kit antiderrames', hayCorr ? (g.lavaojos === true ? 'lavaojos ✓' : 'falta ducha o lavaojos') : '', g.procedimiento === true ? 'procedimiento ✓' : 'falta procedimiento'].filter(Boolean).join(' · ') },
    { ok: !incompat, t: 'Almacenamiento por compatibilidad (buena práctica; secciones 7 y 10 de la FDS)', a: 'Guía', d: incompat ? incompat + ' par(es) incompatible(s) en el mismo lugar' : 'Sin incompatibles juntos según la matriz de referencia' },
    { ok: !prioSinCtl, t: 'Sustancias carcinógenas o de toxicidad aguda identificadas y con controles', a: 'Res. 0312, 4.1.3', d: prio.length ? prio.length + ' prioritaria(s)' + (prioSinCtl ? ' · ' + prioSinCtl + ' sin controles anotados' : ' con controles') : 'Ninguna marcada como prioritaria' }];
}
function pintar(){
  const u = enUso(), lg = lugares(), req = requisitos(), h = UI.hoy();
  const conProb = u.filter((x)=> problemas(x).length).length, incompat = lg.reduce((a, L)=> a + L.n, 0), cumple = req.filter((r)=> r.ok).length;
  $('nInv').textContent = de('sustancia').length; $('nAlm').textContent = incompat; $('nGes').textContent = req.length - cumple;
  $('kpis').innerHTML = '<div class="kpi"><div class="v">' + u.length + '</div><div class="n">sustancias en uso</div><div class="f">' + u.filter((x)=> prioritaria(x.resumen)).length + ' prioritaria(s) (carcinógenas o toxicidad aguda)</div></div>' +
    '<div class="kpi ' + (conProb ? 'mal' : 'ok') + '"><div class="v">' + conProb + '</div><div class="n">con ficha o etiqueta por resolver</div></div>' +
    '<div class="kpi ' + (incompat ? 'mal' : 'ok') + '"><div class="v">' + incompat + '</div><div class="n">pares incompatibles almacenados juntos</div></div>' +
    '<div class="kpi ' + (cumple === req.length ? 'ok' : cumple >= req.length - 2 ? '' : 'mal') + '"><div class="v">' + cumple + ' / ' + req.length + '</div><div class="n">requisitos de la Res. 773 y buenas prácticas</div></div>';
  ({ inventario: pintarInv, almacen: pintarAlm, gestion: pintarGes })[tab]($('panel'));
}
/* ── Inventario ── */
function pintarInv(panel){
  const l = de('sustancia').slice().sort((a, b)=> (a.resumen.estado === 'Fuera de uso') - (b.resumen.estado === 'Fuera de uso') || problemas(b).length - problemas(a).length || prioritaria(b.resumen) - prioritaria(a.resumen) || String(a.titulo).localeCompare(String(b.titulo)));
  panel.innerHTML = '<input type="search" class="buscar" id="bus" placeholder="Buscar por nombre, uso, lugar o CAS">' + '<div id="lInv"></div>' +
    '<button type="button" class="btn amber" id="bNueva">+ Agregar sustancia</button>' +

      return '<tr' + (s.estado === 'Fuera de uso' ? ' style="color:#888;"' : '') + '><td class="a">' + (i + 1) + '</td><td>' + esc(s.nombre) + (s.estado === 'Fuera de uso' ? '<br>(fuera de uso)' : '') + '</td><td>' + esc(s.fabricante || '') + '</td><td>' + esc([s.uso, s.area].filter(Boolean).join(' · ')) + '</td><td>' + esc(s.ubicacion || '') + '</td><td>' + esc([s.estadoFisico, s.cantidad].filter(Boolean).join(' · ')) + '</td><td>' + esc([s.cas, s.onu ? 'ONU ' + s.onu : ''].filter(Boolean).join(' · ')) + '</td><td>' + esc(s.pictogramas || '—') + '</td><td>' + esc(s.palabra || '') + '</td><td>' + esc(s.frasesH || '') + '</td><td class="a">' + (prioritaria(s) ? 'SÍ' : '') + '</td><td' + (malF ? ' style="background:#f6d4cf;"' : '') + '>' + fds + '</td><td' + (s.etiquetaSGA && s.etiquetaSGA !== 'Conforme al SGA' ? ' style="background:#f6d4cf;"' : '') + '>' + esc(s.etiquetaSGA || '') + '</td><td>' + esc(s.epp || '') + '</td></tr>'; }).join('') + '</table>';
  UI.imprimir([UI.cabecera('SG-SUSTANCIAS', 'INVENTARIO DE SUSTANCIAS QUÍMICAS', 'Corte ' + UI.corta(h) + ' · ' + enUso().length + ' en uso · Res. 773 de 2021') + t], true);
}
function pdfMatriz(){
  const lg = lugares().filter((L)=> L.l.length);
  if (!lg.length) { UI.toast('Sin sustancias en uso.'); return; }
  const ref = '<table><tr><td class="l"></td>' + COD.map((c)=> '<td class="l" style="font-size:8px;">' + esc(PIC[c].n) + '</td>').join('') + '</tr>' + COD.map((a)=> '<tr><td class="l">' + esc(PIC[a].n) + '</td>' + COD.map((b)=> { const v = mx(a, b); return '<td class="a" style="background:' + (v === 'N' ? '#f6d4cf' : v === 'P' ? '#fbecc0' : '#d5efdd') + ';">' + (v === 'S' ? 'Sí' : v === 'P' ? 'Prec.' : 'NO') + '</td>'; }).join('') + '</tr>').join('') + '</table>';
  const hojas = [UI.cabecera('SG-COMPATIBILIDAD', 'MATRIZ DE COMPATIBILIDAD DE ALMACENAMIENTO', 'Corte ' + UI.corta(UI.hoy())) + UI.seccion('REFERENCIA POR PICTOGRAMA DEL SGA', ref + '<p style="font-size:9px;margin:4px 0 0;">Sí: pueden almacenarse juntos · Prec.: con precaución (separar con distancia, bandejas o estantes distintos) · NO: no se almacenan juntos. Ácidos y bases siempre separados. Referencia de buenas prácticas: se confirma con las secciones 7 y 10 de cada ficha de datos de seguridad.</p>')];
  lg.forEach((L)=> hojas.push(UI.cabecera('SG-COMPATIBILIDAD', 'MATRIZ DE COMPATIBILIDAD: ' + L.nombre.toUpperCase(), L.l.length + ' sustancia(s) · ' + L.n + ' par(es) incompatible(s)') +
    matrizLugar(L, true).replace('class="mx"', '') + (L.pares.length ? UI.seccion('PARES QUE REQUIEREN ATENCIÓN', '<table><tr><td class="l">Sustancias</td><td class="l">Resultado</td><td class="l">Por qué</td></tr>' + L.pares.map((p)=> '<tr><td>' + esc(p.a.resumen.nombre + ' + ' + p.b.resumen.nombre) + '</td><td>' + (p.v === 'N' ? 'NO JUNTOS' : 'Con precaución') + '</td><td>' + esc(p.motivos.join(' ')) + '</td></tr>').join('') + '</table>') : '')));
  UI.imprimir(hojas, true);
}
function pdfGestion(){
  const req = requisitos(), g = (gestion() || {}).resumen || {};
  UI.imprimir([UI.cabecera('SG-GESTION-QUIMICA', 'GESTIÓN DEL RIESGO QUÍMICO · RES. 773 DE 2021', 'Corte ' + UI.corta(UI.hoy())) +
    UI.seccion('DATOS', UI.tablaDatos([['Responsable', g.responsable || '—'], ['Sustancias en uso', String(enUso().length)], ['Última capacitación en SGA', g.capacitacionSGA ? UI.corta(g.capacitacionSGA) + (g.capacitados ? ' · ' + g.capacitados + ' persona(s)' : '') : '—'], ['Próxima capacitación', UI.corta(g.proximaCapacitacion) || '—'], ['Última revisión del inventario', UI.corta(g.inventarioRevisado) || '—']])) +
    UI.seccion('REQUISITOS', '<table><tr><td class="l" style="width:4%">N°</td><td class="l">Requisito</td><td class="l" style="width:12%">Referencia</td><td class="l" style="width:9%">Estado</td><td class="l" style="width:32%">Detalle</td></tr>' + req.map((r, i)=> '<tr><td class="a">' + (i + 1) + '</td><td>' + esc(r.t) + '</td><td>' + esc(r.a) + '</td><td class="a" style="background:' + (r.ok ? '#d5efdd' : '#f6d4cf') + ';">' + (r.ok ? 'Cumple' : 'Pendiente') + '</td><td>' + esc(r.d) + '</td></tr>').join('') + '</table>')]);
}
$('tabs').addEventListener('click', (e)=>{ const b = e.target.closest('[data-tab]'); if (!b) return; tab = b.dataset.tab; document.querySelectorAll('#tabs button').forEach((x)=> x.classList.toggle('on', x === b)); pintar(); });
window.addEventListener('outbox-enviado', ()=> cargar());
cargar().then(async ()=> { if (location.hash.length > 1) { const id = decodeURIComponent(location.hash.slice(1)); if (/^SUS-/.test(id)) { const d = await Registros.abrir(id); if (d) editarSus(d); } else if (id === ID_GES) document.querySelector('#tabs [data-tab="gestion"]').click(); } });
</script>
